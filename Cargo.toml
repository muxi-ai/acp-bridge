[package]
name = "muxi-acp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ACP <-> MUXI bridge: presents a remote MUXI formation as an Agent Client Protocol agent"
repository = "https://github.com/muxi-ai/acp-bridge"

[dependencies]
agent-client-protocol = "2"
muxi-rust = "1.20260713.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
humantime = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
rand = "0.8"
keyring = "4"

[dev-dependencies]
axum = "0.8"
proptest = "1.11.0"
tempfile = "3"
